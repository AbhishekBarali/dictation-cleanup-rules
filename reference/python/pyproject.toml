[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dictation-cleanup-reference"
version = "1.0.0"
description = "Readability-first Python reference for the deterministic dictation cleanup stages"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
py-modules = ["cleanup", "_distance", "_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
